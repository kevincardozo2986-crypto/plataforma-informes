name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            architecture: x64
          - os: macos-latest
            target: macOS-AppleSilicon
            architecture: arm64
          - os: macos-15-intel
            target: macOS-Intel
            architecture: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3
      - name: Test
        run: python -m pytest tests -q
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean build.spec
      - name: Verify packaged application
        run: python scripts/check_bundle.py
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/SantotoTunjaInformes -DestinationPath artifacts/SantotoTunjaInformes-Windows.zip
      - name: Archive macOS application preserving bundle structure
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/SantotoTunjaInformes.app artifacts/SantotoTunjaInformes-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: SantotoTunjaInformes-${{ matrix.target }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
