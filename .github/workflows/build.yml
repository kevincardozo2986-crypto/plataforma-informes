name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            architecture: x64
          - os: macos-latest
            target: macOS-AppleSilicon
            architecture: arm64
          - os: macos-15-intel
            target: macOS-Intel
            architecture: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3
      - name: Test
        run: python -m pytest tests -q
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean build.spec
      - name: Verify packaged application
        run: python scripts/check_bundle.py
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/SantotoTunjaInformes -DestinationPath artifacts/SantotoTunjaInformes-Windows.zip
      - name: Archive macOS application preserving bundle structure
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/SantotoTunjaInformes.app artifacts/SantotoTunjaInformes-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: SantotoTunjaInformes-${{ matrix.target }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: SantotoTunjaInformes-*
          path: artifacts
          merge-multiple: true
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                name: `Santoto Tunja ${tag}`,
                draft: true,
                body: 'Descarga y extrae el ZIP de tu sistema. Windows: abre SantotoTunjaInformes.exe dentro de la carpeta extraída. macOS: abre SantotoTunjaInformes.app; elige AppleSilicon para chips M o Intel para procesadores Intel. Esta versión corrige el diseño de cursos según create/created, el recuento de estudiantes únicos, la identificación de docentes y los campos vacíos. Filtra el CSV por año y semestre (enero-junio o julio-diciembre) y permite a los usuarios el CRUD completo de opciones académicas. Incluye el acceso fijo de respaldo admin / admin. Para actualizar informes anteriores, vuelve a procesar el CSV. Para convertir a PDF se necesita LibreOffice o Microsoft Word instalado.'
              })).data;
            }
            for (const name of fs.readdirSync('artifacts').filter(name => name.endsWith('.zip'))) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(`artifacts/${name}`)
              });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false });
